name: Opel preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified main as an Opel prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: opel-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Ensure GitHub Pages stays removed
        run: |
          test ! -e .github/workflows/pages.yml
          if rg -l 'actions/(configure-pages|deploy-pages|upload-pages-artifact)@' .github/workflows; then
            echo '::error::GitHub Pages deployment must remain removed from the Opel fork.'
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools on GitHub runner
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and compare lint with sync baseline
        run: bash .github/scripts/opel-verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opel-verification
          path: |
            app/build/reports/lint-results-opel.*
            verification/
            app/build/outputs/apk/opel/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: opel-debug-tests
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Sign with existing Opel key and compare published certificate
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          OPEL_KEYSTORE_BASE64: ${{ secrets.OPEL_KEYSTORE_BASE64 }}
          OPEL_KEYSTORE_PASSWORD: ${{ secrets.OPEL_KEYSTORE_PASSWORD }}
          OPEL_KEY_ALIAS: ${{ secrets.OPEL_KEY_ALIAS }}
          OPEL_KEY_PASSWORD: ${{ secrets.OPEL_KEY_PASSWORD }}
        run: bash .github/scripts/opel-sign.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: opel-signed
          path: dist/
          if-no-files-found: error
          retention-days: 14

  emulation:
    needs: verify
    uses: ./.github/workflows/android-emulators.yml
    with:
      artifact: opel-debug-tests
      mode: debug
      artifact-prefix: opel-ui

  smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    uses: ./.github/workflows/android-emulators.yml
    with:
      artifact: opel-signed
      mode: opel
      artifact-prefix: opel-signed-startup

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [verify, emulation, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: opel-signed
          path: dist
      - name: Publish immutable-tag prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/opel-publish.py
