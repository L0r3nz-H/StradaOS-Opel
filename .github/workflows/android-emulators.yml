name: Android emulator checks

on:
  workflow_call:
    inputs:
      artifact:
        description: APK artifact from this workflow run
        required: true
        type: string
      mode:
        description: debug for upstream UI tests, opel for signed Opel startup
        required: true
        type: string
      artifact-prefix:
        description: Screenshot and log artifact prefix
        default: capturas
        type: string

permissions:
  contents: read

jobs:
  emulator:
    name: Android API ${{ matrix.api }} (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { api: 16, arch: x86 }
          - { api: 19, arch: x86 }
          - { api: 21, arch: x86 }
          - { api: 23, arch: x86 }
          - { api: 24, arch: x86 }
          - { api: 28, arch: x86 }
          - { api: 30, arch: x86_64 }
          - { api: 34, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: emulator-apk
      - name: Enable KVM on GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TEST_MODE: ${{ inputs.mode }}
          TEST_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1024x600
          emulator-boot-timeout: 900
          script: bash .github/scripts/run-emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}-api${{ matrix.api }}
          path: capturas/
          if-no-files-found: warn
          retention-days: 14
