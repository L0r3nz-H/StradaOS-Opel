name: Opel preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified main as an Opel prerelease
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: opel-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android build tools on GitHub runner
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and compare lint with sync baseline
        run: bash .github/scripts/opel-verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opel-verification
          path: |
            app/build/reports/lint-results-opel.*
            verification/
            app/build/outputs/apk/opel/*.apk
          retention-days: 14
      - name: Sign with existing Opel key and compare published certificate
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          OPEL_KEYSTORE_BASE64: ${{ secrets.OPEL_KEYSTORE_BASE64 }}
          OPEL_KEYSTORE_PASSWORD: ${{ secrets.OPEL_KEYSTORE_PASSWORD }}
          OPEL_KEY_ALIAS: ${{ secrets.OPEL_KEY_ALIAS }}
          OPEL_KEY_PASSWORD: ${{ secrets.OPEL_KEY_PASSWORD }}
        run: bash .github/scripts/opel-sign.sh
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: opel-signed
          path: dist/
          if-no-files-found: error
          retention-days: 14

  smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: opel-signed
          path: dist
      - name: Enable KVM on GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Signed Opel launch on Android 11
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -skin 1024x600
          disable-animations: true
          script: bash .github/scripts/opel-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opel-smoke
          path: smoke/

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [verify, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: opel-signed
          path: dist
      - name: Publish immutable-tag prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/opel-publish.py
