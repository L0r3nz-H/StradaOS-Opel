name: Pruebas en emuladores

# Instala la versión de prueba en emuladores de varias versiones de Android (pantalla 1024x600), abre cada
# pantalla, toma capturas y falla si StradaOS se cierra o se traba. Las capturas quedan en la rama «pruebas»
# (carpeta por versión de Android) para revisarlas sin el carro.
on:
  push:
    branches: [ main ]
    paths: [ 'app/**', '.github/workflows/pruebas.yml', '.github/scripts/smoke.sh' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/*.apk app-prueba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-prueba.apk

  emulador:
    needs: build
    uses: ./.github/workflows/android-emulators.yml
    with:
      artifact: apk
      mode: debug

  publicar:
    needs: [build, emulador]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: capturas-*
          path: out
          merge-multiple: true
      - name: Subir capturas a la rama «pruebas»
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          {
            echo "# Pruebas en emuladores"
            echo
            echo "Commit: ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            for d in api*; do
              n=$(ls "$d"/*.png 2>/dev/null | wc -l)
              if [ -f "$d/CIERRES.txt" ]; then st="❌ cierre (ver CIERRES.txt)"; elif [ "$n" -gt 0 ]; then st="✅ sin cierres"; else st="⚠️ sin capturas (el emulador no arrancó)"; fi
              echo "- **$d**: $st · $n capturas"
            done
          } > README.md
          git init -q -b pruebas
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Capturas de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pruebas
